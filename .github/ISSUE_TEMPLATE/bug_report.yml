name: Bug report
description: Report a reproducible code, data-contract, or result-integrity problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the command, variant, scale, seed, and relevant traceback.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      placeholder: Full Git commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python, PyTorch, accelerator, OS, and attention backend.
    validations:
      required: true
  - type: checkboxes
    id: sensitive
    attributes:
      label: Sensitive data
      options:
        - label: I removed credentials, private hostnames, and internal storage paths.
          required: true
