name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Prepare pinned agent contracts
        run: |
          git submodule update --init --depth 1 third_party/verl
          git -C third_party/verl submodule update --init --depth 1 third_party/uni_agent third_party/mimoagent-osr
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess

          root = pathlib.Path.cwd()
          spec = json.loads((root / "docs/upstreams.json").read_text())["verl"]
          packages = [(root / spec["path"], spec)]
          packages += [(root / spec["path"] / item["path"], item)
                       for item in spec["dependencies"].values()]
          for checkout, item in packages:
              actual = subprocess.check_output(["git", "-C", str(checkout), "rev-parse", "HEAD"]).decode().strip()
              assert actual == item["revision"], checkout
              for patch in item["patches"]:
                  path = root / patch["path"]
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == patch["sha256"], path
                  subprocess.run(["git", "-C", str(checkout), "apply", str(path)], check=True)
          for checkout, item in packages:
              diff = subprocess.check_output(["git", "-C", str(checkout), "diff", "--full-index", "HEAD", "--"])
              assert hashlib.sha256(diff).hexdigest() == item["working_diff_sha256"], checkout
          PY
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install CPU environment
        run: uv sync --locked --extra cpu --extra tracking --group dev
      - name: Lint
        run: uv run --no-sync ruff check src/archlab tests
      - name: Audit publication tree
        run: uv run --no-sync python -m archlab.reporting.publication_audit --output /tmp/publication-audit.json
      - name: Test
        env:
          NANOCHAT_ATTENTION_BACKEND: sdpa
        run: uv run --no-sync pytest -m "not slow" -q
