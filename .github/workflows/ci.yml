name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install CPU environment
        run: uv sync --locked --extra cpu --extra tracking --group dev
      - name: Lint
        run: uv run ruff check src/archlab tests
      - name: Verify frozen artifacts
        run: |
          uv run next-gen-arch verify
          uv run python -c "from archlab.results import verify_metrics; print(verify_metrics())"
      - name: Verify portable launch plans
        env:
          NGA_DATA_ROOT: /tmp/next-gen-arch-data
          NGA_TRAIN_DATA: /tmp/train_text_document
          NGA_VALID_DATA: /tmp/valid_text_document
          NGA_DATA_CACHE: /tmp/data-cache
          NGA_TOKENIZER: /tmp/tokenizer
          NGA_OUTPUT_DIR: /tmp/megatron-output
        run: |
          uv run next-gen-arch render --config recipes/experiments/speedrun_qwen_gdn_100m_seed42.yaml
          uv run next-gen-arch render --config recipes/experiments/megatron_baseline_1b_seed42.yaml --json
          uv run python -m archlab.megatron.miles_v41_stock_launch render --config recipes/experiments/deepseek_v41_stock_fp8.yaml --run-root /tmp/miles-plan --miles /tmp/miles --address head:17379
      - name: Test
        env:
          NANOCHAT_ATTENTION_BACKEND: sdpa
        run: uv run pytest -m "not slow" -q
