[project]
name = "next-gen-arch"
version = "0.1.0"
description = "Architecture research on pretrained language models: inserted attention preludes, SFT and agentic RL"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "docs/NOTICE.md", "docs/licenses/*.txt"]
authors = [
    {name = "CATL 21C Lab SCIAGI"},
]
keywords = ["language-model", "pytorch", "verl", "tilelang", "architecture", "scaling-laws"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "datasets>=4.0.0",
    "filelock>=3.20.0",
    "jinja2>=3.1.6",
    "hydra-core==1.3.2",
    "numpy>=1.26.0",
    "omegaconf==2.3.1",
    "psutil>=7.1.0",
    "pyarrow>=21.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "safetensors>=0.6.2",
    "tokenizers>=0.22.0",
]

[project.urls]
Homepage = "https://github.com/CATL-21CLab-SCIAGI/next-gen-arch"
Issues = "https://github.com/CATL-21CLab-SCIAGI/next-gen-arch/issues"

[project.scripts]
archlab = "archlab.training.cli:main"

[project.entry-points."vllm.general_plugins"]
archlab_limite = "archlab.training.serving:register"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "build>=1.3.0",
    "einops==0.8.2",
    "math-verify==0.9.0",
    "openai>=2.41,<3",
    "pytest>=9.0.0",
    "rich>=14.0.0",
    "ruff>=0.12.0",
    "tensorboard>=2.20.0",
    "tenacity>=9.1.4",
]

tracking = ["mlflow-skinny==3.16.1"]
agentic = ["e2b==2.24.0"]
eval = [
    "lm-eval==0.4.13",
    "matplotlib>=3.10.0",
    "tensorboard>=2.20.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/archlab"]

[tool.hatch.build.targets.wheel.force-include]
"docs/licenses/verl-Apache-2.0.txt" = "archlab/licenses/verl-Apache-2.0.txt"

[tool.hatch.build.targets.sdist]
only-include = [
    "src", "tests", "recipes", "docs", "scripts", ".github",
    "README.md", "AGENTS.md", "LICENSE", "docs/NOTICE.md",
    "CITATION.cff", "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: long-running or hardware-sensitive tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Persisted enums retain their historical str()/repr() behavior.
"src/archlab/training/bootstrap.py" = ["UP042"]
