[project]
name = "next-gen-arch"
version = "0.1.0"
description = "A backend-aware architecture lab spanning speedrun experiments and Megatron scaling"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "CATL 21C Lab SCIAGI"},
]
keywords = ["language-model", "pytorch", "megatron", "architecture", "scaling-laws"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "datasets>=4.0.0",
    "filelock>=3.20.0",
    "jinja2>=3.1.6",
    "numpy>=1.26.0",
    "psutil>=7.1.0",
    "pyarrow>=21.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "rustbpe>=0.1.0",
    "tiktoken>=0.11.0",
    "tokenizers>=0.22.0",
    "wandb>=0.21.3",
]

[project.urls]
Homepage = "https://github.com/CATL-21CLab-SCIAGI/next-gen-arch"
Issues = "https://github.com/CATL-21CLab-SCIAGI/next-gen-arch/issues"

[project.scripts]
next-gen-arch = "archlab.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "build>=1.3.0",
    "pytest>=9.0.0",
    "ruff>=0.12.0",
]

[project.optional-dependencies]
cpu = ["torch==2.9.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/archlab"]

[tool.hatch.build.targets.wheel.force-include]
"results/parameter-scale-100m-1b-v1-manifest.json" = "src/archlab/data/parameter-scale-100m-1b-v1-manifest.json"
"results/key-metrics.csv" = "src/archlab/data/key-metrics.csv"
"results/speedrun-10m-reference.csv" = "src/archlab/data/speedrun-10m-reference.csv"
"results/backend-10m-comparison.csv" = "src/archlab/data/backend-10m-comparison.csv"
"results/backend-10m-runs.csv" = "src/archlab/data/backend-10m-runs.csv"
"results/backend-10m-comparison.json" = "src/archlab/data/backend-10m-comparison.json"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.venv",
    "/dist",
    "/build",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: long-running or hardware-sensitive tests",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/archlab/speedrun/base_train.py" = ["E402"]
"src/archlab/speedrun/tok_train.py" = ["E402"]
"src/archlab/speedrun/tokenizer.py" = ["B019", "E402"]

[tool.uv]
default-groups = []

[tool.uv.sources]
torch = [
    {index = "pytorch-cpu", extra = "cpu"},
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
