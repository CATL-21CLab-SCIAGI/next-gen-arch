# Versioned scientific contract. Successor to variant_scaling_ladders.yaml for agentic RL:
# its W100 endpoints (100M supervised math tokens, every weight trained) become agents by
# one shared agentic SFT stage, then matched GRPO on MiMo code repair compares attention
# variants. The 2026-10-13 conversion bootstrap (docs/LIMITE_AGENTIC_CONVERSION.md) learned
# the native tool protocol from <=510 public trajectories but solved no MiMo task; this
# contract changes the teacher data (thousands of solved on-policy MiMo episodes), not the
# protocol or the deployed agent.
name: limite-agentic-variants-v1
question: >-
  Starting from matched math-SFT endpoints that differ only in their inserted prelude
  mechanism, which variant becomes the better MiMo code-repair agent after the same agentic
  SFT, and which learns more verified repairs per GPU-hour and per generated token in GRPO?
parents:
  ladder: recipes/sft/limite/variant_scaling_ladders.yaml
  rung: W100   # warm parents, 100M supervised tokens, every weight trained, best LR per arm
  arms:
    normal-nc-warm: {run: W100-normal-nc-warm, val_ce: 0.5512}            # control
    simplicial-w16-nc-warm: {run: W100-simplicial-w16-nc-warm, val_ce: 0.5504}
    # Amendment 2026-11-06: the wider simplicial arms with the next-best W100 CE join; SFT order is
    # w16, normal, w24, w32 (strongest first, control second).
    simplicial-w24-nc-warm: {run: W100-simplicial-w24-nc-warm, val_ce: 0.5509}
    simplicial-w32-nc-warm: {run: W100-simplicial-w32-nc-warm, val_ce: 0.5513}
    triadic-e4-nc-warm: {run: W100-triadic-e4-nc-warm, val_ce: 0.5515}
    gdn-nc-warm: {run: W100-gdn-nc-warm}
  # triadic and gdn W100 endpoints were trained with the retired CuTe delta kernels; their
  # parents need a TileLang-delta parity check before export (2026-11-06 export refused).
  blocked: [triadic-e4-nc-warm, gdn-nc-warm]
  export: archlab.training.limite.export_continued_insertion
  # Violetto's text-only template rejects tools; agentic stages use the publisher (base)
  # template with the native Hermes tool block. Tokenizer and EOS rows are identical.
  chat_template: paradigma-inc/limite-1b-base@cc612bafcd4acd8445936201694c8c41aea8e479
agentic_sft:
  recipe: recipes/sft/limite_teacher_preludes.yaml   # parent_stage=adapter_endpoint, trainable_mode=full
  data:
    prepared: limite-agentic-qwen-teachers-128k-20261106
    producer: results/agentic-data-20261106/prepare_teacher_sft.py
    teachers: solved (verifier reward 1, completed) Qwen3.5 BashOnlyAgent episodes from RL waves 5-8 and the 4B pilot
    selection: at most 2 shortest solved episodes per task; one bash call per assistant turn; native Hermes round trip
    exclusions: every mimo-v2.6-rl-crossdomain-v1 code held-out task (64, including the evaluator's 43) by id and problem hash
    split: sha256(instance_id) mod 1e4 < 500 -> validation
    max_length: 131072   # native context; teacher episodes run 40k-130k tokens
    generation_eos_token_id: 151645
    manifest_sha256: see /mnt/oss/datasets/tokenized/limite-agentic-qwen-teachers-128k-20261106/manifest.json
    train: {rows: 1037, tasks: 550, assistant_tokens: 20858997, input_tokens: 46437660}
    validation: {rows: 64, tasks: 32, assistant_tokens: 1298525}
    # 36,928 solved of 175,025 indexed sessions; 4,492 fewest-turn candidates; 3,518 encoded
    # (rejections by reason in the manifest), then at most 2 per task.
  schedule:
    global_batch_rows: 32
    optimizer: {name: AdamW, betas: [0.9, 0.95], weight_decay: 0, clip: 1.0}
    lr: {peak: 1.0e-4, warmup: 10% of steps, decay: cosine, final: 1.0e-5}  # the protocol-recovering LR
    supervised_tokens: 41717994   # two epochs of train assistant tokens; 65 steps reach 41,948,138
    evaluations: 4
  seed: 42
admission_to_rl:
  # Measured on every arm with the same sampler; failures are recorded, never waived.
  # Amendment 2026-11-06: one grid serves both gates. Tasks are the 41 baseline-qualified held-out tasks
  # (Qwen evaluator QUALIFICATION accepted ∩ crossdomain code held-out ∩ exported image; frozen as
  # results/limite-agentic-variants-20261106/heldout-41, prompts audited under the Limite template).
  # The 12 other exported held-out tasks have no oracle qualification, so a zero there is uninformative.
  grid: archlab.evaluation.agentic_curve, 41 tasks x 8 seeds, MiMo harness v4 (300 turns, 8192-token
    turns, temperature 1, top_p 1, 7200 s), DLC CPU sandboxes; missing verdicts stay missing
  protocol: first assistant turn of each episode emits one parseable bash call or idle EOS (>= 90%)
  capability: nonzero verifier reward on the grid (pass@1 and success@8, task bootstrap CI);
    the pre-SFT agentic parent is the paired baseline
  serving: vLLM Limite serving supports normal and simplicial preludes; triadic and gdn arms
    enter RL only after their recurrent-state serving passes logit parity
rl:
  recipe: recipes/rl/limite_code.yaml shape (verl GRPO, colocate, vLLM rollouts, DLC CPU sandboxes)
  tasks: 783 oracle-qualified mimo-v2.6-rl-crossdomain-v1 code train tasks; each seen <= 2 times per run
  matched: seed, task order, batch, group size, response budget, steps and sandbox harness across arms
  metrics: held-out pass@1 every 10 steps, solved tasks per GPU-hour, generated tokens per solved task
