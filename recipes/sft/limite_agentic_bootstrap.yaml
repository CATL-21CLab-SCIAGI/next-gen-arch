# New full-weight experiment; production admission is separate from composition.
# The parent is an immutable exported normal control or simplicial conversion.
name: limite-simplicial-agentic-bootstrap-v1
variant: simplicial
objective: assistant_ce
native_context: 131072
parent_checkpoint: ${oc.env:ARCHLAB_BOOTSTRAP_MODEL}
data_manifest: ${oc.env:ARCHLAB_BOOTSTRAP_DATA}/manifest.json
settings:
  checkpoint.save_contents: [model, optimizer, extra, hf_model]
  checkpoint.load_contents: [model, optimizer, extra]
  model.path: ${oc.env:ARCHLAB_BOOTSTRAP_MODEL}
  model.external_lib: archlab.training.megatron
  model.trust_remote_code: false
  model.use_remove_padding: false
  model.use_fused_kernels: false
  model.enable_gradient_checkpointing: true
  engine.dtype: bfloat16
  engine.tensor_model_parallel_size: 1
  engine.pipeline_model_parallel_size: 1
  engine.context_parallel_size: 1
  engine.expert_model_parallel_size: 1
  engine.sequence_parallel: false
  engine.use_distributed_optimizer: true
  engine.use_remove_padding: false
  engine.pad_bshd_to_minibatch_max: false
  engine.patch_recomputation_backward: false
  engine.override_ddp_config:
    grad_reduce_in_fp32: true
    overlap_grad_reduce: false
  optim.lr: 1.0e-5
  optim.betas: [0.9, 0.95]
  optim.weight_decay: 0.0
  optim.clip_grad: 1.0
  data.train_files: ["${oc.env:ARCHLAB_BOOTSTRAP_DATA}/train.parquet"]
  data.val_files: ["${oc.env:ARCHLAB_BOOTSTRAP_DATA}/validation.parquet"]
  data.custom_cls.path: pkg://archlab.data.agentic_sft
  data.custom_cls.name: PreparedAgenticSFTDataset
  data.pad_mode: no_padding
  data.truncation: error
  data.max_length: 16384
  data.max_token_len_per_gpu: 16384
  data.train_batch_size: 8
  data.micro_batch_size_per_gpu: 1
  data.use_dynamic_bsz: false
  data.num_workers: 0
  trainer.nnodes: 1
  trainer.n_gpus_per_node: 8
  trainer.seed: 42
  trainer.total_epochs: 5
  trainer.save_freq: after_each_epoch
  trainer.test_freq: after_each_epoch
  trainer.resume_mode: disable
  trainer.project_name: Limite — Full fine tuning
  trainer.default_local_dir: ${oc.env:ARCHLAB_BOOTSTRAP_OUTPUT}/checkpoints
  trainer.logger: [console, mlflow]
