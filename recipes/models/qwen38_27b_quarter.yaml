  sequence_len: 2048
  max_position_embeddings: 262144
  num_hidden_layers: 16
  hidden_size: 1280
  intermediate_size: 4352
  attention_pattern: [gdn, gdn, gdn, full_attention]
  full_attention:
    query_heads: 6
    kv_heads: 1
    head_dim: 64
    partial_rotary_factor: 0.25
    output_gate: sigmoid
  gdn:
    qk_heads: 4
    value_heads: 12
    key_dim: 32
    value_dim: 32
    conv_kernel: 4
  mtp_layers: 1
precision:
  recipe: bf16
  dependency_policy: unmodified_container_runtime
optimizer:
  name: megatron_native_muon
  scalar_fallback: adam
  fp32_matmul_precision: medium
  coefficient_schedule: polar_express
  newton_schulz_steps: 8
  peak_learning_rate: 5.0e-5
  minimum_learning_rate: 5.0e-6
