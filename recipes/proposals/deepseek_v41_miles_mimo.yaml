  miles_upstream_branch: zczeng/dsv41-rl-support
  miles_root: env:ARCHLAB_MILES_ROOT
parents:
  normal:
    checkpoint: env:ARCHLAB_RL_PARENT_NORMAL
    marker_sha256: 3f946519f860a516345cd80cfff2764be6e1aa0095b791cddcc92aa3a06769fc
  simplicial:
    checkpoint: env:ARCHLAB_RL_PARENT_SIMPLICIAL
