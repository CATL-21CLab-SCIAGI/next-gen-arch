# Explicit bootstrap curriculum: native context stays 131072; turns cap at 8192.
# The package reports a length-capped turn as LimitsExceeded, never Idle.
use_dataset_env: true
agent:
  type: bashonly-agent
  step_limit: 500
  # Bound tool stdout with the upstream visible head/tail warning, in characters.
  max_observation_length: 12000
environment:
  environment_class: archlab.training.sandbox.E2BEnvironment
  timeout: 300
  sandbox_timeout: 7200
  anti_hack_cleanup: true
  git_leak_prevention: none
model:
  model_name: policy
  protocol: chat
  model_kwargs:
    temperature: 1.0
    max_tokens: 8192
