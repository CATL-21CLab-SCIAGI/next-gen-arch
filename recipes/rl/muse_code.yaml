# Fresh native publisher control. Resolution is not GPU or RL qualification.
# Standard verl DP training owns execution; MiMo owns tasks, agents and rewards.
name: muse-glimmer-30b-mimo-code-fresh-v1
family: muse_glimmer
variant: normal
intervention: none
engine: dp
attention: native
execution: colocate_async
throughput:
  baseline: ${oc.env:ARCHLAB_THROUGHPUT_BASELINE,null}
native_context: 131072
parent_checkpoint: ${oc.env:ARCHLAB_PARENT_CHECKPOINT}
parent_stage: published_checkpoint
parent_tokens: null
publisher_manifest: ${oc.env:ARCHLAB_MODEL_MANIFEST}
data_manifest: ${oc.env:ARCHLAB_CODE_DATA}/manifest.json
pilot:
  max_turn_tokens: 8192
  step_limit: 500
  minimum_prompt_groups: 2
  minimum_completed_verifiers: 8
  minimum_tool_calls: 1
  minimum_observation_tokens: 1
  minimum_reward_contrast_groups: 1
  maximum_truncated_trajectories: 0
settings:
  ray_kwargs.ray_init:
    address: local
    num_cpus: 32
    runtime_env:
      env_vars:
        VERL_MFU_DEVICE_NAME: B300
        TRANSFER_QUEUE_ENABLE: "1"
        UNI_AGENT_RUNNER_TASK_NUM_CPUS: "0.25"
        MIXED_HARNESS_SPEC: ${oc.env:ARCHLAB_HARNESS_SPEC}
        MIXED_HARNESS_MODE: step-hash
        E2B_DOMAIN: ${oc.env:E2B_DOMAIN}
        ARCHLAB_E2B_KEY_FILE: ${oc.env:ARCHLAB_E2B_KEY_FILE}
        ARCHLAB_E2B_TEMPLATE_MAP: ${oc.env:ARCHLAB_E2B_TEMPLATE_MAP}
  actor_rollout_ref.model.path: ${oc.env:ARCHLAB_PARENT_CHECKPOINT}
  actor_rollout_ref.model.trust_remote_code: false
  # Official Transformers FA4 integration; actual window/backward parity still
  # requires GPU qualification against native vLLM before admitting RL.
  actor_rollout_ref.model.override_config:
    attn_implementation: flash_attention_4
  actor_rollout_ref.model.use_remove_padding: false
  actor_rollout_ref.model.use_fused_kernels: false
  actor_rollout_ref.model.enable_gradient_checkpointing: true
  # Native text-only objectives update the text model. Vision has no text-loss
  # gradient; this does not rely on the unused upstream freeze_vision_tower flag.
  actor_rollout_ref.actor.strategy: fsdp2
  actor_rollout_ref.actor.fsdp_config.strategy: fsdp2
  actor_rollout_ref.actor.fsdp_config.model_dtype: fp32
  actor_rollout_ref.actor.fsdp_config.dtype: bfloat16
  actor_rollout_ref.actor.fsdp_config.use_torch_compile: false
  # Keep sharded state on the B300s: this node has 256 GiB host RAM, less than
  # the aggregate FP32 masters and Adam moments for the native 30B model.
  actor_rollout_ref.actor.fsdp_config.fsdp_size: 8
  actor_rollout_ref.actor.fsdp_config.param_offload: false
  actor_rollout_ref.actor.fsdp_config.optimizer_offload: false
  actor_rollout_ref.actor.use_torch_compile: false
  actor_rollout_ref.actor.use_rollout_log_probs: true
  actor_rollout_ref.actor.optim.optimizer: Adam
  actor_rollout_ref.actor.optim.optimizer_impl: torch.optim
  actor_rollout_ref.actor.optim.lr: 1.0e-6
  actor_rollout_ref.actor.optim.betas: [0.9, 0.95]
  actor_rollout_ref.actor.optim.weight_decay: 0.0
  actor_rollout_ref.actor.optim.clip_grad: 1.0
  actor_rollout_ref.actor.optim.lr_scheduler_type: constant
  actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu: 1
  actor_rollout_ref.actor.use_dynamic_bsz: false
  actor_rollout_ref.actor.ppo_mini_batch_size: 2
  actor_rollout_ref.actor.ppo_max_token_len_per_gpu: 131072
  actor_rollout_ref.actor.loss_agg_mode: token-mean
  actor_rollout_ref.actor.use_kl_loss: false
  actor_rollout_ref.actor.entropy_coeff: 0
  actor_rollout_ref.rollout.name: vllm
  actor_rollout_ref.rollout.enforce_eager: true
  actor_rollout_ref.rollout.enable_prefix_caching: false
  actor_rollout_ref.rollout.enable_chunked_prefill: true
  actor_rollout_ref.rollout.checkpoint_engine.backend: naive
  actor_rollout_ref.rollout.engine_kwargs:
    vllm:
      model_impl: vllm
      limit_mm_per_prompt: {image: 0, video: 0}
  actor_rollout_ref.rollout.load_format: auto
  actor_rollout_ref.rollout.multi_turn.enable: true
  actor_rollout_ref.rollout.multi_turn.format: muse_glimmer
  actor_rollout_ref.rollout.calculate_log_probs: true
  actor_rollout_ref.rollout.n: 4
  actor_rollout_ref.rollout.tensor_model_parallel_size: 1
  actor_rollout_ref.rollout.pipeline_model_parallel_size: 1
  actor_rollout_ref.rollout.data_parallel_size: 1
  actor_rollout_ref.rollout.max_model_len: 131072
  actor_rollout_ref.rollout.max_num_batched_tokens: 131072
  actor_rollout_ref.rollout.prompt_length: 16384
  actor_rollout_ref.rollout.response_length: 114688
  actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu: 1
  actor_rollout_ref.rollout.log_prob_max_token_len_per_gpu: 131072
  actor_rollout_ref.rollout.log_prob_use_dynamic_bsz: false
  actor_rollout_ref.rollout.temperature: 1.0
  actor_rollout_ref.rollout.top_p: 1.0
  actor_rollout_ref.rollout.top_k: -1
  actor_rollout_ref.rollout.do_sample: true
  actor_rollout_ref.rollout.logprobs_mode: processed_logprobs
  actor_rollout_ref.rollout.val_kwargs:
    n: 1
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    do_sample: true
  actor_rollout_ref.rollout.gpu_memory_utilization: 0.3
  actor_rollout_ref.rollout.max_num_seqs: 1
  actor_rollout_ref.rollout.disable_log_stats: false
  actor_rollout_ref.rollout.prometheus.enable: true
  actor_rollout_ref.rollout.agent.num_workers: 1
  actor_rollout_ref.rollout.agent.agent_loop_manager_class: uni_agent.framework.entry.AgentFrameworkRolloutAdapter
  actor_rollout_ref.rollout.custom:
    agent_framework:
      gateway_count: 1
      log_dir: ${oc.env:ARCHLAB_OUTPUT}/agents
      mask_unfinished_episode: true
      trajectory_validator: archlab.training.rollout.RolloutContract
      ship_turn_index: false
      repetition_detect:
        enable: false
      agent_runners:
        mimoagent:
          runner_fqn: recipes.code.mimoagent_runner.mimoagent_runner
          dispatch_mode: ray_task
          max_concurrent_sessions: 8
          trajectory_selection: longest
          session_timeout_seconds: 7200
          agent_request_idle_timeout_seconds: 720
          trajectory_timeout_by_dataset: {}
  algorithm.adv_estimator: grpo
  algorithm.norm_adv_by_std_in_grpo: true
  algorithm.use_kl_in_reward: false
  algorithm.rollout_correction.bypass_mode: false
  algorithm.rollout_correction.rollout_is: token
  algorithm.rollout_correction.rollout_is_threshold: 2.0
  algorithm.rollout_correction.rollout_is_batch_normalize: false
  algorithm.rollout_correction.rollout_rs: null
  algorithm.filter_groups.enable: false
  data.custom_cls:
    path: pkg://recipes.code.dataset
    name: MimoAgentSWEDataset
  reward.custom_reward_function:
    path: pkg://recipes.code.reward
    name: compute_score
  data.train_files: ["${oc.env:ARCHLAB_CODE_DATA}/train.parquet"]
  data.val_files: ["${oc.env:ARCHLAB_CODE_DATA}/validation.parquet"]
  data.max_prompt_length: 16384
  data.max_response_length: 114688
  data.truncation: error
  data.return_raw_chat: true
  data.filter_overlong_prompts: false
  data.apply_chat_template_kwargs:
    reasoning_strength: high
  data.train_batch_size: 2
  data.val_batch_size: 3
  data.gen_batch_size: 1
  data.dataloader_num_workers: 2
  data.seed: 42
  transfer_queue.enable: true
  transfer_queue.backend.SimpleStorage.num_data_storage_units: 2
  trainer.nnodes: 1
  trainer.n_gpus_per_node: 8
  trainer.total_training_steps: 20
  trainer.total_epochs: 20
  trainer.save_freq: 5
  trainer.max_actor_ckpt_to_keep: 2
  trainer.test_freq: 5
  trainer.val_before_train: false
  trainer.project_name: Muse — RL
  trainer.default_local_dir: ${oc.env:ARCHLAB_OUTPUT}/checkpoints
  trainer.logger: [console, mlflow]
  # Phase/token accounting is model agnostic; Muse MFU is not yet qualified.
  trainer.metrics_extension: archlab.training.metrics.step_metrics
  trainer.resume_mode: disable
  trainer.v1.sampler.max_off_policy_threshold: 1
