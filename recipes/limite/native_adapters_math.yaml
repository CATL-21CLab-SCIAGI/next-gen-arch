  - 4000000000
  - 6000000000
  - 8000000000
  - 10000000000
  checkpoint_storage: env:LIMITE_ADAPTER_OSS
  tracking_experiment: "Limite \u2014 Adapter warmup"
  detached_loss_and_any_rank_stop_vote: combined_sum_collective
