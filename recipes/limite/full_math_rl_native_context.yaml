# Fresh matched RL from the same 10B-token SFT endpoint for each variant.
name: limite-matched-full-math-rl-native-context-v4
upstream: https://github.com/XiaomiMiMo/verl/tree/a2ad9f6160b03ff2d47e59832bfb6b289f37c917
model:
  variants: [normal, simplicial]
  trainable_mode: full
  attention_backend: tilelang
  initialization: matched_10B_SFT_weights_fresh_RL_optimizer
training:
  world_size_per_variant: 8
  max_steps: 400
  learning_rate: 1.0e-5
  epsilon: 0.2
  epsilon_high: 0.2
  responses_per_update: 64
  num_generations: 4
  seed: 42
  phase_start: 0
  checkpoint_steps: 10
data:
  source: nvidia/Nemotron-RL-Math-v2
  split_sha256: 73d3e170b5a10aea286cc79e786fab301f7dabecae3385cc022c7b8fc692e15b
  prompt_limit: 2048
  heldout: 128
rollout:
  budget_mode: native_context
  max_tokens: 131072
  overlong_buffer: 4096
  overlong_penalty: 0.0
  unfinished_penalty: 0.0
  repetition_penalty: 0.5
execution:
  require_pinned_verl: true
  rollout_timeout_seconds: 43200
  eval_on_start: false
  replay_head_chunk_size: 512
  native_replay: true
  native_replay_backend: sdpa_native
  graph_decode: true
  native_decode_gqa: true
  native_decode_backend: flash_attn_kvcache
  reuse_decode: true
  compact_decode: true
  async_rollouts: true
  overlap_actor_learner: false
  rollout_rendezvous: gloo_after_drain
  max_policy_lag: 1
  responses_per_update: 64
  trim_replay: true
  skip_flat_backward: true
curriculum:
  initial_fraction: 0.5
  anneal_steps: 128
  pool: shared_training_only_verified_mixed_outcome_problems
evaluation:
  shaped_rewards: false
  heldout_unchanged: true
  benchmark_after_training: aime26_native_context
  report_natural_eos_and_context_exhaustion: true
admission:
  full_context_backward: 131072
  finite_adapter_and_backbone_gradients: true
  rollout_behavior_probabilities_recorded: true
  replay_importance_ratios_healthy: true
  full_rollout_health:
    clipped_token_fraction_max: 0.05
    effective_sample_fraction_min: 0.95
    mean_importance_weight_range: [0.5, 2.0]
    extrema: diagnostics_only
    upstream: verl/docs/algo/rollout_corr.md
  distributed_optimizer_checkpoint_resume: true
