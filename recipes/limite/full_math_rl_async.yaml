# Versioned scientific contracts; select catalog entries with FILE.yaml#PROFILE.
name: limite-native-full-math-rl-async-v3
upstream: https://github.com/XiaomiMiMo/verl/tree/a2ad9f6160b03ff2d47e59832bfb6b289f37c917
rollout:
  max_tokens: 16384
  overlong_buffer: 4096
  overlong_penalty: 0.5
  unfinished_penalty: 0.5
  repetition_penalty: 0.5
execution:
  graph_decode: true
  native_decode_gqa: true
  native_decode_backend: flash_attn_kvcache
  reuse_decode: true
  compact_decode: true
  async_rollouts: true
  overlap_actor_learner: false
  rollout_rendezvous: gloo_after_drain
  max_policy_lag: 1
  responses_per_update: 64
  actor_rng: restored_rank_cuda_then_independent_generator
  checkpoint_prefetch: completed_batch_and_generator_state
  trim_replay: true
  skip_flat_backward: true
curriculum:
  initial_fraction: 0.5
  anneal_steps: 128
  pool: shared_training_only_verified_mixed_outcome_problems
evaluation:
  shaped_rewards: false
  shared_heldout_unchanged: true
  report_natural_eos_and_length_caps: true
