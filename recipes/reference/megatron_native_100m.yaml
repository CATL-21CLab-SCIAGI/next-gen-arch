      moe_aux_loss_coeff: 0.01
      moe_router_dtype: fp32
      moe_token_dispatcher_type: alltoall
      moe_grouped_gemm: true
      moe_permute_fusion: true
  moe_100m_ep1_single:
    extends:
    - megatron_native_100m.yaml#moe_100m_ep1
    name: megatron-native-moe-100m-ep1-single-seed42
    parallelism:
      nodes: 1
      gpus_per_node: 4
  moe_100m_ep2_single:
    extends:
    - megatron_native_100m.yaml#moe_100m_ep1_single
    name: megatron-native-moe-100m-ep2-single-seed42
    parallelism:
      expert: 2
  moe_100m_ep6:
    extends:
    - megatron_native_100m.yaml#moe_100m_ep1
    name: megatron-native-moe-100m-ep6-seed42
    parallelism:
      expert: 6
