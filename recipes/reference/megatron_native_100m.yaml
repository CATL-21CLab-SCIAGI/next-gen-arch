# Versioned scientific contracts; select catalog entries with FILE.yaml#PROFILE.
profiles:
  dense_100m_cp2:
    extends:
    - megatron_native_100m.yaml#dense_100m_dp
    name: megatron-native-dense-100m-cp2-seed42
    parallelism:
      context: 2
      context_comm_type: p2p
  dense_100m_cp2_single:
    extends:
    - megatron_native_100m.yaml#dense_100m_dp4
    name: megatron-native-dense-100m-cp2-single-seed42
    parallelism:
      context: 2
      context_comm_type: p2p
  dense_100m_dp4:
    extends:
    - megatron_native_100m.yaml#dense_100m_dp5
    name: megatron-native-dense-100m-dp4-seed42
    parallelism:
      gpus_per_node: 4
  dense_100m_dp5:
    extends:
    - megatron_native_100m.yaml#dense_100m_dp
    name: megatron-native-dense-100m-dp5-seed42
    parallelism:
      nodes: 1
      gpus_per_node: 5
  dense_100m_dp:
    extends:
    - ../defaults.yaml#base
    - ../defaults.yaml#backends_megatron
    - ../defaults.yaml#scales_megatron_native_100m
    name: megatron-native-dense-100m-dp-seed42
    variant: baseline
    seed: 42
    parallelism:
      nodes: 2
      gpus_per_node: 6
      tensor: 1
      pipeline: 1
      context: 1
      expert: 1
  dense_100m_pp2:
    extends:
    - megatron_native_100m.yaml#dense_100m_dp
    name: megatron-native-dense-100m-pp2-seed42
    parallelism:
      pipeline: 2
  dense_100m_pp5:
    extends:
    - megatron_native_100m.yaml#dense_100m_dp5
    name: megatron-native-dense-100m-pp5-seed42
    parallelism:
      pipeline: 5
  dense_100m_tp2:
    extends:
    - megatron_native_100m.yaml#dense_100m_dp
    name: megatron-native-dense-100m-tp2-seed42
    parallelism:
      tensor: 2
      sequence_parallel: true
  dense_100m_tp2_single:
    extends:
    - megatron_native_100m.yaml#dense_100m_dp4
    name: megatron-native-dense-100m-tp2-single-seed42
    parallelism:
      tensor: 2
      sequence_parallel: true
  moe_100m_ep1:
    extends:
    - megatron_native_100m.yaml#dense_100m_dp
    name: megatron-native-moe-100m-ep1-seed42
